services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "dev"
      POSTGRES_DB: "tasks"
    volumes: 
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_create_tasks_up.sql:/docker-entrypoint-initdb.d/001_create_tasks_up.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "tasks"] 
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
  api:
    build: .
    environment:
      DATABASE_URL: "postgres://postgres:dev@db:5432/tasks"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: 
